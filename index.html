<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEスタンプ販売ページ</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f8f9fa; text-align: center; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        .main-img { width: 100%; max-width: 250px; height: auto; margin-bottom: 20px; }
        .btn { display: inline-block; width: 80%; background: #06C755; color: #fff; text-decoration: none; padding: 15px; font-weight: bold; border-radius: 30px; font-size: 1.1rem; box-shadow: 0 4px 0 #059b42; transition: 0.2s; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- スタンプのタイトル -->
        <h1>【新作】ゆるかわ動物スタンプ</h1>
        <!-- スタンプの説明文 -->
        <p>毎日使える可愛い動物たちのスタンプです！</p>
        
        <!-- スタンプの紹介画像（後であなたの画像に変えられます） -->
        <img src="https://placehold.co" alt="スタンプ画像" class="main-img">
        
        <br>
        <!-- LINE STOREへのリンク（URLをあなたのスタンプページに変えてください） -->
        <a href="https://line.me" target="_blank" class="btn">LINE STOREで見る</a>
    </div>
</body>
</html>
